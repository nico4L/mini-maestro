<title>Mini Maestro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&display=block">
<style>
/* Layout: a winding lesson path on a soft "music-room" ground; lesson view = coach bubble, scrolling staff, keyboard docked at the bottom.
   Note colors follow the classic boomwhacker convention (Do red → Si violet). */
:root{
  --bg:#EDF2FA; --surface:#FFFFFF; --surface-2:#E2E9F5; --ink:#1A2240; --ink-soft:#56607F; --line:#C7D1E4;
  --accent:#2F55D4; --accent-ink:#FFFFFF; --gold:#F2AE00; --good:#1E9A52; --bad:#D9363E;
  --staff:#1A2240; --key-white:#FDFDFF; --key-black:#1A1F33; --key-edge:#B4BED3;
  --c-do:#E5443B; --c-re:#EF842B; --c-mi:#D9AC00; --c-fa:#36A54B; --c-sol:#139FAF; --c-la:#3567DB; --c-si:#8A55D6;
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --music:"Noto Music","Bravura","Segoe UI Symbol",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11162A; --surface:#1B2240; --surface-2:#252D52; --ink:#EEF1FB; --ink-soft:#A2ABCB; --line:#353F69;
  --accent:#7D95FF; --accent-ink:#0E1330; --gold:#FFC53D; --good:#4CCB7F; --bad:#FF6B6B;
  --staff:#DCE2F6; --key-white:#F2F4FA; --key-black:#0A0D18; --key-edge:#5B6488; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11162A; --surface:#1B2240; --surface-2:#252D52; --ink:#EEF1FB; --ink-soft:#A2ABCB; --line:#353F69;
  --accent:#7D95FF; --accent-ink:#0E1330; --gold:#FFC53D; --good:#4CCB7F; --bad:#FF6B6B;
  --staff:#DCE2F6; --key-white:#F2F4FA; --key-black:#0A0D18; --key-edge:#5B6488; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#app{min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:28px}
.ico{width:1.2em;height:1.2em;display:inline-block;vertical-align:-.2em;flex:none}

/* ---------- Home ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--surface);border-radius:24px;padding:18px 20px;box-shadow:0 2px 0 var(--line)}
.mascot{width:76px;height:76px}
.mascot.small{width:48px;height:48px}
.hero h1{font-size:clamp(1.5rem,4vw,2rem);display:flex;flex-wrap:wrap;gap:.3em;align-items:baseline}
.name-btn{font-family:var(--display);font-weight:600;color:var(--accent);border-bottom:3px dotted currentColor;padding:0 2px}
.name-input{font:600 1.6rem var(--display);width:9em;max-width:100%;border:2px solid var(--accent);border-radius:10px;padding:0 8px;background:var(--surface);color:var(--ink)}
.lvl{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--ink-soft);font-weight:700;font-size:.95rem;flex-wrap:wrap}
.lvl b{color:var(--ink);font-family:var(--display);font-weight:600}
.xpbar{flex:1;min-width:120px;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.xpbar span{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .6s}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface-2);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;min-width:0}
.stat svg{width:30px;height:30px;flex:none}
.stat .v{font:600 1.35rem/1 var(--display);font-variant-numeric:tabular-nums}
.stat .k{font-size:.78rem;color:var(--ink-soft);font-weight:700;letter-spacing:.02em}
.goal-dots{display:flex;gap:4px;margin-top:4px}
.goal-dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.goal-dots i.on{background:var(--good)}

.chapter{display:flex;flex-direction:column;gap:12px}
.chapter-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--cc);padding-bottom:8px}
.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--cc)}
.chapter-head h2{font-size:1.5rem}
.chapter-head p{margin:2px 0 0;color:var(--ink-soft);font-size:.95rem}
.chapter-score{font-weight:800;color:var(--ink-soft);display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.path{list-style:none;margin:0;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:14px;--zig:1}
@media (max-width:520px){.path{--zig:.55}.stats{grid-template-columns:1fr 1fr 1fr;gap:6px}.stat{flex-direction:column;align-items:flex-start;gap:4px;padding:8px}.stat svg{width:22px;height:22px}}
.path li{display:flex;flex-direction:column;align-items:center;gap:4px;transform:translateX(calc(var(--off) * 1px * var(--zig)));width:150px;text-align:center}
.node{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--cc);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--cc) 60%,#000);transition:transform .12s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--cc) 60%,#000)}
.node svg{width:38px;height:38px}
.node.locked{background:var(--surface-2);color:var(--ink-soft);box-shadow:0 6px 0 var(--line);cursor:not-allowed}
.node.current{animation:pulse 1.6s ease-in-out infinite;outline:4px solid color-mix(in srgb,var(--cc) 35%,transparent);outline-offset:5px}
@keyframes pulse{50%{transform:scale(1.07)}}
.path .label{font-weight:800;font-size:.92rem;line-height:1.2}
.path .label small{display:block;font-weight:700;color:var(--ink-soft);font-size:.75rem}
.stars{display:flex;gap:2px;justify-content:center}
.stars svg{width:18px;height:18px}
.crown{color:var(--gold)}

.trophies h2,.parents h2{font-size:1.35rem;margin-bottom:12px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--surface);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 0 var(--line)}
.badge svg{width:36px;height:36px;flex:none}
.badge b{display:block;font-size:.88rem;line-height:1.2}
.badge small{color:var(--ink-soft);font-size:.75rem;line-height:1.2;display:block}
.badge.off{opacity:.45;filter:grayscale(1)}
.parents details{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:0 2px 0 var(--line)}
.parents summary{font-weight:800;cursor:pointer}
.parents p,.parents li{color:var(--ink-soft);line-height:1.55;max-width:65ch}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:14px;font-weight:800;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn.danger{background:var(--bad);color:#fff}
.btn.on{background:var(--good);color:#fff}
.btn:disabled{opacity:.5;cursor:default}

.custom-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.custom-item{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:10px 12px;box-shadow:0 2px 0 var(--line)}
.custom-item .node svg{width:28px;height:28px}
.ci-text{flex:1;min-width:0}.ci-text b{display:block;overflow-wrap:anywhere}.ci-text small{color:var(--ink-soft);font-weight:700;font-size:.8rem}
.ci-text .stars{justify-content:flex-start}
.empty{color:var(--ink-soft);margin:0}
.studio-form{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:0 2px 0 var(--line)}
.studio-form summary{font-weight:800;cursor:pointer}
.studio-form form{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.studio-form label{font-weight:800;font-size:.85rem;margin-top:6px}
.studio-form input,.studio-form select,.studio-form textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;box-sizing:border-box}
.studio-form textarea{font-family:var(--display);font-size:1.05rem;resize:vertical}
.form-row{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.form-row>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.help{color:var(--ink-soft);font-size:.85rem;line-height:1.5;margin:4px 0 0;max-width:70ch}
.form-error{color:var(--bad);font-weight:800;margin:4px 0 0}
.studio-form .row{display:flex;gap:8px;margin-top:8px}

/* ---------- Lesson ---------- */
.lesson{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 0;max-width:1200px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:0 2px 0 var(--line);flex:none}
.iconbtn svg{width:22px;height:22px}
.pbar{flex:1;height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.pbar span{display:block;height:100%;width:0;background:var(--good);border-radius:inherit;transition:width .3s}
.ltitle{font:600 1.05rem var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.inputs{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:12px;background:var(--surface);box-shadow:0 2px 0 var(--line);font-weight:800;font-size:.85rem}
.chip.on{background:var(--good);color:#fff;box-shadow:0 2px 0 color-mix(in srgb,var(--good) 55%,#000)}
.chip svg{width:20px;height:20px}
.meter{width:6px;height:22px;border-radius:3px;background:rgba(255,255,255,.35);position:relative;overflow:hidden}
.meter i{position:absolute;left:0;right:0;bottom:0;background:#fff;height:0}
.coach{display:flex;align-items:center;gap:10px;min-height:56px}
.bubble{background:var(--surface);border-radius:16px;padding:10px 14px;font-weight:700;line-height:1.35;position:relative;box-shadow:0 2px 0 var(--line);flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:var(--surface)}
.bubble.good{color:var(--good)}
.bubble.bad{color:var(--bad)}
.heard{font-size:.8rem;font-weight:800;color:var(--ink-soft);white-space:nowrap}
.staff-wrap{position:relative;flex:1 1 auto;min-height:150px;background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.staff-wrap svg{position:absolute;left:0;overflow:visible}
#staffScroll{will-change:transform}
#staffScroll.ease{transition:transform .35s cubic-bezier(.3,.7,.3,1)}
.clef-panel{background:linear-gradient(90deg,var(--surface) 82%,transparent)}
.playhead{position:absolute;top:10%;bottom:10%;width:4px;margin-left:-2px;border-radius:2px;background:var(--accent);opacity:.22}
.note-g .halo{opacity:0}
.note-g.cur .halo{opacity:1;animation:halo 1s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.15)}}
.note-g .halo{transform-box:fill-box;transform-origin:center}
.note-g.ok{opacity:.35}
.note-g.miss .head{fill:var(--bad)!important;stroke:var(--bad)!important}
.note-g.miss{opacity:.6}
.staff-wrap.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{position:absolute;top:10px;left:50%;transform:translateX(-50%);font:700 1.2rem var(--display);pointer-events:none;opacity:0}
.feedback.show{animation:pop .7s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,8px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-14px)}}
.countdown{position:absolute;inset:0;display:grid;place-items:center;font:700 4rem var(--display);color:var(--accent);background:color-mix(in srgb,var(--surface) 70%,transparent)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.controls .btn{padding:8px 12px;font-size:.9rem}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:3px}
.seg button{padding:7px 12px;border-radius:11px;font-weight:800;font-size:.88rem;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.kbd-wrap{flex:0 0 auto;height:clamp(150px,30vh,240px);overflow-x:auto;overflow-y:hidden;padding-bottom:max(8px,env(safe-area-inset-bottom,0px));touch-action:manipulation}
.kbd{position:relative;display:flex;height:100%;min-width:560px;user-select:none;-webkit-user-select:none}
.wk{flex:1;position:relative;background:var(--key-white);border:1px solid var(--key-edge);border-top:0;border-radius:0 0 12px 12px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;margin-right:-1px;transition:background .08s;touch-action:none}
.bk{position:absolute;top:0;height:60%;background:var(--key-black);border-radius:0 0 8px 8px;z-index:2;box-shadow:inset 0 -6px 0 rgba(255,255,255,.12);touch-action:none}
.kl{font:600 .95rem var(--display);color:var(--kc);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.kl i{width:10px;height:10px;border-radius:50%;background:var(--kc)}
.hide-names .kl{visibility:hidden}
.wk.target{background:color-mix(in srgb,var(--kc) 30%,var(--key-white));box-shadow:inset 0 -8px 0 var(--kc)}
.wk.target::after{content:"";position:absolute;top:12px;left:50%;margin-left:-9px;width:18px;height:18px;border-radius:50%;background:var(--kc);animation:bob .9s ease-in-out infinite}
.wk.hint::after{width:26px;height:26px;margin-left:-13px}
@keyframes bob{50%{transform:translateY(8px)}}
.bk.target{background:var(--kc)}
.wk.down{background:color-mix(in srgb,var(--accent) 22%,var(--key-white))}
.bk.down{background:color-mix(in srgb,var(--accent) 60%,var(--key-black))}
.wk.good,.bk.good{background:var(--good)!important}
.wk.bad,.bk.bad{background:var(--bad)!important}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,14,30,.55);display:grid;place-items:center;z-index:20;padding:16px}
.card{background:var(--surface);border-radius:26px;padding:24px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.card h2{font-size:1.8rem}
.bigstars{display:flex;gap:8px;align-items:end}
.bigstars svg{width:64px;height:64px}
.bigstars svg:nth-child(2){width:80px;height:80px}
.bigstars svg{animation:starIn .5s both}
.bigstars svg:nth-child(2){animation-delay:.25s}.bigstars svg:nth-child(3){animation-delay:.5s}
@keyframes starIn{0%{transform:scale(0) rotate(-60deg)}70%{transform:scale(1.2)}100%{transform:none}}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.res-grid div{background:var(--surface-2);border-radius:14px;padding:8px}
.res-grid b{display:block;font:600 1.3rem var(--display);font-variant-numeric:tabular-nums}
.res-grid small{font-size:.75rem;color:var(--ink-soft);font-weight:700}
.newbadge{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--gold) 20%,var(--surface));border-radius:14px;padding:8px 12px;text-align:left;font-weight:700;width:100%}
.newbadge svg{width:34px;height:34px;flex:none}
.card .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;max-width:min(92vw,520px);z-index:30;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:25;width:100%;height:100%}
@media (max-width:560px){.chip-l,.ltitle{display:none}.chip{padding:0 10px}.controls .btn{padding:7px 10px;font-size:.85rem}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<canvas id="confetti" hidden></canvas>

<script>
(() => {
'use strict';
/* ================= Music data ================= */
const FR = ['Do','Do♯','Ré','Ré♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const CVAR = ['--c-do','--c-do','--c-re','--c-re','--c-mi','--c-fa','--c-fa','--c-sol','--c-sol','--c-la','--c-la','--c-si'];
const PC_LETTER = [0,0,1,1,2,3,3,4,4,5,5,6];
const IS_BLACK = [0,1,0,1,0,0,1,0,1,0,1,0];
const SEMI = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const n2m = s => { const m = /^([A-G])(#?)(\d)$/.exec(s); return 12*(+m[3]+1) + SEMI[m[1]] + (m[2]?1:0); };
const diat = m => Math.floor(m/12 - 1)*7 + PC_LETTER[m%12];
const col = m => `var(${CVAR[m%12]})`;
const parseSeq = str => str.trim().split(/\s+/).filter(t => t !== '|').map(tok => {
  const [n, d] = tok.split('/');
  return { notes: n.split('+').map(n2m), dur: d ? parseFloat(d) : 1 };
});

const WORLDS = [
 { title:'Do Ré Mi', desc:'Tes trois premières notes, avec le pouce, l’index et le majeur.', color:'var(--c-do)', lessons:[
   { t:'Le Do', type:'note', bpm:76, intro:'Voici le Do ! C’est la touche blanche juste à gauche des 2 touches noires. Joue-le chaque fois qu’il arrive.',
     seq:'C4 C4 C4 C4 | C4/2 C4/2 | C4 C4 C4/2 | C4/4' },
   { t:'Le Ré', type:'note', bpm:76, intro:'Le Ré est juste à droite du Do, entre les 2 touches noires. Sur la partition, il est sous la première ligne.',
     seq:'D4 D4 D4/2 | C4 D4 C4 D4 | D4 C4 D4/2 | C4/4' },
   { t:'Le Mi', type:'note', bpm:76, intro:'Le Mi est juste à droite du Ré. Sur la partition, il est posé sur la première ligne.',
     seq:'E4 E4 E4/2 | C4 D4 E4/2 | E4 D4 C4/2 | E4 E4 C4/2 | D4 E4 C4/2' },
   { t:'L’escalier', type:'exo', bpm:84, intro:'On monte et on descend l’escalier Do Ré Mi. Garde un doigt par touche !',
     seq:'C4 D4 E4/2 | E4 D4 C4/2 | C4 E4 D4 E4 | C4 D4 E4/2 | E4 D4 C4/2 | C4/4' },
   { t:'Au clair de la lune', type:'song', bpm:92, intro:'Ta première chanson ! Elle n’utilise que Do, Ré et Mi. Clique sur « Écouter » pour l’entendre d’abord.',
     seq:'C4 C4 C4 D4 | E4/2 D4/2 | C4 E4 D4 D4 | C4/4 | C4 C4 C4 D4 | E4/2 D4/2 | C4 E4 D4 D4 | C4/4' },
 ]},
 { title:'Fa et Sol', desc:'Toute la main droite : un doigt sur chaque touche, du Do au Sol.', color:'var(--c-fa)', lessons:[
   { t:'Le Fa', type:'note', bpm:76, intro:'Le Fa est juste à gauche des 3 touches noires. Sur la partition, il est dans le premier espace entre les lignes.',
     seq:'F4 F4 F4/2 | E4 F4 E4 F4 | D4 E4 F4/2 | F4 E4 D4 C4 | F4/4' },
   { t:'Le Sol', type:'note', bpm:76, intro:'Le Sol est juste à droite du Fa. Il est sur la 2e ligne, celle où s’enroule la clé de sol !',
     seq:'G4 G4 G4/2 | F4 G4 F4 G4 | E4 F4 G4/2 | G4 F4 E4 D4 | C4/4' },
   { t:'Les 5 doigts', type:'exo', bpm:84, intro:'Pouce sur Do, puis Ré, Mi, Fa, et l’auriculaire sur Sol. Ta main ne bouge plus !',

const FR_PC = { do:0, 'ré':2, re:2, mi:4, fa:5, sol:7, la:9, si:11 };
const EN = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const m2s = m => EN[m%12] + (Math.floor(m/12) - 1);
function parseFrNote(tok) {
  const m = /^(do|ré|re|mi|fa|sol|la|si)(#|♯|b|♭)?('*)$/i.exec(tok); if (!m) return null;
  const v = 60 + FR_PC[m[1].toLowerCase()] + (m[2] ? (/[#♯]/.test(m[2]) ? 1 : -1) : 0) + 12*m[3].length;
  return v >= 60 && v <= 84 ? v : null;
}
function parseFrSong(str) {
  const steps = [], bad = [];
  str.replace(/[’‘`]/g, "'").split(/\s+/).filter(t => t && t !== '|').forEach(tok => {
    const [n, d] = tok.split('/'); const dur = d ? parseFloat(d.replace(',', '.')) : 1;
    const ms = n.split('+').map(parseFrNote);
    if (!n || ms.some(x => x == null) || !(dur > 0 && dur <= 8)) bad.push(tok); else steps.push(ms.map(m2s).join('+') + '/' + dur);
  });
  return { seq:steps.join(' '), count:steps.length, bad };
}
function parseFrChords(str) {
  if (!str.trim()) return { chords:'', bad:[] };
  const bad = [];
  const bars = str.split('|').map(bar => bar.trim().split(/\s+/).filter(Boolean).map(tok => {
    const m = /^(do|ré|re|mi|fa|sol|la|si)(#|♯)?(m)?$/i.exec(tok);
    if (!m) { bad.push(tok); return ''; }
    const pc = FR_PC[m[1].toLowerCase()] + (m[2] ? 1 : 0); return EN[pc % 12] + (m[3] ? 'm' : '');
  }).filter(Boolean).join(' ') || 'C');
  return { chords:bars.join(' | '), bad };
}

const ST = { S:14, BOT:118, BW:66, H:178, LEFT:30 };
const yOf = d => ST.BOT - (d - 30) * ST.S / 2;

function buildSteps(l) {

}
function staffSVG(l, steps, total) {
  const { S: s, BW, H, LEFT } = ST; const meter = l.meter || 4, pickup = l.pickup || 0;
  const W = LEFT + total*BW + 120; let g = '';
  for (let b = pickup || meter; b < total - 0.001; b += meter) { const x = LEFT + b*BW + 2; g += `<line x1="${x}" x2="${x}" y1="${yOf(38)}" y2="${yOf(30)}" stroke="var(--staff)" stroke-width="1.6"/>`; }
  const xe = LEFT + total*BW + 6;

  steps.forEach((st, i) => {
    const ds = st.notes.map(diat), x = st.x, dur = st.dur;
    const avg = ds.reduce((a, b) => a + b, 0) / ds.length; const up = avg < 34;
    const hollow = dur >= 2; let h = `<g class="note-g" data-i="${i}">`;
    const top = Math.max(...ds), bot = Math.min(...ds);
    h += `<ellipse class="halo" cx="${x}" cy="${(yOf(top)+yOf(bot))/2}" rx="20" ry="${(yOf(bot)-yOf(top))/2 + 16}" fill="color-mix(in srgb,var(--accent) 18%,transparent)" stroke="var(--accent)" stroke-width="2"/>`;
    ds.forEach(d => { // ledger lines
      for (let L = 28; L >= d; L -= 2) h += `<line x1="${x-13}" x2="${x+13}" y1="${yOf(L)}" y2="${yOf(L)}" stroke="var(--staff)" stroke-width="1.6"/>`;
      for (let L = 40; L <= d; L += 2) h += `<line x1="${x-13}" x2="${x+13}" y1="${yOf(L)}" y2="${yOf(L)}" stroke="var(--staff)" stroke-width="1.6"/>`;
    });
    if (dur < 4) {
      const sx = up ? x + 7.2 : x - 7.2; const y1 = up ? yOf(bot) : yOf(top); const y2 = up ? yOf(top) - 3.4*s : yOf(bot) + 3.4*s;
      h += `<line x1="${sx}" x2="${sx}" y1="${y1}" y2="${y2}" stroke="var(--staff)" stroke-width="1.8"/>`;
      if (dur < 1) h += up ? `<path d="M${sx} ${y2} q2 10 11 16 q-6 -4 -11 -6z" fill="var(--staff)"/>` : `<path d="M${sx} ${y2} q2 -10 11 -16 q-6 4 -11 6z" fill="var(--staff)"/>`;
    }
    st.notes.forEach((m, k) => {
      const y = yOf(ds[k]); const c = col(m);
      h += `<ellipse class="head" cx="${x}" cy="${y}" rx="7.6" ry="5.7" transform="rotate(-20 ${x} ${y})" fill="${hollow ? 'var(--surface)' : c}" stroke="${hollow ? c : 'var(--staff)'}" stroke-width="${hollow ? 2.6 : 0.8}"/>`;
      if (IS_BLACK[m%12]) h += `<text x="${x-20}" y="${y+5}" font-size="16" font-weight="700" fill="var(--staff)">♯</text>`;
      if (dur === 1.5 || dur === 3) h += `<circle cx="${x+13}" cy="${y - ((ds[k]%2===0)?3.5:0)}" r="2.1" fill="var(--staff)"/>`;
    });
    h += `<text class="nname" x="${x}" y="${H-10}" text-anchor="middle" font-family="var(--display)" font-weight="600" font-size="12" fill="${col(st.notes[st.notes.length-1])}">${st.notes.map(m => FR[m%12]).join('+')}</text>`;

}
function clefSVG(l) {

  g += `<text x="6" y="${yOf(30)+11}" font-family="var(--music)" font-size="${s*5.1}" fill="var(--staff)">&#x1D11E;</text>`;
  g += `<text x="58" y="${yOf(34)-2}" font-family="var(--display)" font-weight="700" font-size="${s*2}" text-anchor="middle" fill="var(--staff)">${meter}</text>`;
  g += `<text x="58" y="${yOf(30)-2}" font-family="var(--display)" font-weight="700" font-size="${s*2}" text-anchor="middle" fill="var(--staff)">4</text>`;

function keyboardHTML() {
  const lo = 60, hi = 84; const whites = []; for (let m = lo; m <= hi; m++) if (!IS_BLACK[m%12]) whites.push(m);

/* ================= Lesson engine ================= */
const PRAISE = ['Bravo !', 'Super !', 'Génial !', 'Oui !', 'Parfait !', 'Bien joué !'];
class Lesson {
  constructor(l, steps, total, mode, W, svg) {

    this.scroll.innerHTML = svg; this.clef = document.getElementById('clefPanel'); this.clef.innerHTML = clefSVG(l);
    this.bg = document.getElementById('bgLines');
    this.ro = new ResizeObserver(() => this.layout()); this.ro.observe(this.wrap);
    this.layout();
    this.meterTimer = setInterval(() => { const m = document.getElementById('meter'); if (m) m.style.height = (Mic.on ? Mic.level*100 : 0) + '%'; const h = document.getElementById('heard'); if (h) h.textContent = Mic.on && Mic.heard ? 'J’entends : ' + Mic.heard : ''; }, 80);
    if (mode === 'learn') { this.say(l.intro); this.running = true; this.focus(); }
    else { this.say('Défi rythme ! Joue chaque note quand elle passe sur la ligne bleue. Touche « Démarrer » quand tu es prêt.'); document.getElementById('go').hidden = false; this.setX(this.steps[0].x); }
  }
  get listening() { return this.running && !this.demo; }
  layout() {
    const h = this.wrap.clientHeight, w = this.wrap.clientWidth;
    const k = Math.max(0.75, Math.min(1.7, h / (ST.H + 10), w / 330));
    this.k = k; const top = (h - ST.H*k) / 2;
    const names = S.names;
    this.scroll.querySelectorAll('.nname').forEach(t => t.style.display = names ? '' : 'none');
    for (const el of [this.scroll, this.clef, this.bg]) el.style.top = top + 'px';
    this.scroll.setAttribute('viewBox', `0 0 ${this.W} ${ST.H}`); this.scroll.setAttribute('width', this.W*k); this.scroll.setAttribute('height', ST.H*k);
    this.clef.setAttribute('viewBox', `0 0 92 ${ST.H}`); this.clef.setAttribute('width', 92*k); this.clef.setAttribute('height', ST.H*k);
    this.bg.setAttribute('viewBox', `0 0 ${w/k} ${ST.H}`); this.bg.setAttribute('width', w); this.bg.setAttribute('height', ST.H*k);
    let lines = ''; for (let d = 30; d <= 38; d += 2) lines += `<line x1="0" x2="${w/k}" y1="${yOf(d)}" y2="${yOf(d)}" stroke="var(--staff)" stroke-width="1.4" opacity=".85"/>`;
    this.bg.innerHTML = lines;
    this.clef.innerHTML = clefSVG(this.l).replace(/^/, lines.replace(/x2="[^"]+"/g, 'x2="92"'));

  fb(t, color) { const f = document.getElementById('fb'); if (!f) return; f.textContent = t; f.style.color = color; f.classList.remove('show'); void f.offsetWidth; f.classList.add('show'); }

  input(m, src) {

    const c = chordAt(this.tl, st.beat + 0.01); if (!c || c === this.lastCh) return;
    this.lastCh = c; drum('kick', t, master, 0.6);
    if (Mic.on) return;
    voice(c).forEach(m => tone(m, t, 1.8, master, { type:'triangle', vol:0.045, cut:1500, att:0.03 }));
    tone(bassNote(c), t, 1.6, master, { type:'triangle', vol:0.2, cut:500 });
  }
  miss(m, st) {
    this.mistakes++; this.stepMiss++; this.flashKey(m, 'bad');
    this.wrap.classList.remove('shake'); void this.wrap.offsetWidth; this.wrap.classList.add('shake');
    const want = st.notes.map(n => FR[n%12]).join(' + ');
    if (this.stepMiss >= 2) { st.notes.forEach(n => keyEl(n)?.classList.add('hint')); this.say(`Presque ! Cherche ${st.notes.length>1?'les touches':'la touche'} qui saute : ${want}.`, 'bad'); }
    else this.say(`Oups, c’était un ${FR[m%12]}. On cherche ${want}.`, 'bad');
  }
  /* ---- demo ---- */
  toggleDemo() {
    const btn = document.getElementById('listen');
    if (this.demo) return this.stopDemo();
    if (this.mode === 'rhythm' && this.running) return;
    const ac = audio(); const spb = 60 / this.l.bpm; const t0 = ac.currentTime + 0.25;
    this.steps.forEach(st => st.notes.forEach(m => playNote(m, Math.max(0.5, st.dur*spb*1.1), 0.65, t0 + st.beat*spb)));
    this.demo = { t0, spb };
    if (S.backing && this.l.style) this.backStop = playBacking(this.l, this.total, t0, spb, this.tl);
    btn.innerHTML = `${ICON.stop} Arrêter`;
    this.scroll.classList.remove('ease'); this.clearTargets();
    const tick = () => {
      if (!this.demo) return;
      const b = (AC.currentTime - t0) / spb;
      this.setX(ST.LEFT + Math.max(0, b)*ST.BW + 22);
      let cur = -1; this.steps.forEach((st, i) => { if (b >= st.beat - 0.02 && b < st.beat + st.dur) cur = i; });
      document.querySelectorAll('.wk.down,.bk.down').forEach(e => { if (!held.has(+e.dataset.m)) e.classList.remove('down'); });
      if (cur >= 0) this.steps[cur].notes.forEach(m => keyEl(m)?.classList.add('down'));
      if (b > this.total + 0.3) return this.stopDemo();
      this.demoRaf = requestAnimationFrame(tick);
    };
    tick();
  }
  stopDemo() {
    if (!this.demo) return;
    cancelAnimationFrame(this.demoRaf); this.demo = null; this.backStop?.(); this.backStop = null;
    if (master) { const ac = AC; master.gain.setTargetAtTime(0, ac.currentTime, 0.02); setTimeout(() => master.gain.setTargetAtTime(0.8, AC.currentTime, 0.01), 120); }
    const btn = document.getElementById('listen'); if (btn) btn.innerHTML = `${ICON.play} Écouter`;
    document.querySelectorAll('.wk.down,.bk.down').forEach(e => e.classList.remove('down'));
    if (this.mode === 'learn') { this.scroll.classList.add('ease'); this.focus(); }
    else this.setX(this.steps[0].x, true);
  }
  /* ---- rhythm challenge ---- */
  startRhythm() {
    this.stopDemo(); document.getElementById('go').hidden = true;
    const ac = audio(); const spb = 60 / this.l.bpm; const meter = this.l.meter || 4;
    const lead = meter + (this.l.pickup ? meter - this.l.pickup : 0);
    const t0 = ac.currentTime + 0.4 + lead*spb;
    for (let i = 0; i < lead; i++) click(t0 - (lead - i)*spb, i % meter === 0);
    if (S.backing && this.l.style) this.backStop = playBacking(this.l, this.total, t0, spb, this.tl);
    this.r = { t0, spb, res:this.steps.map(() => null), partial:this.steps.map(() => new Set()) };
    this.running = true; this.scroll.classList.remove('ease');
    const cd = document.createElement('div'); cd.className = 'countdown'; this.wrap.appendChild(cd);
    this.say('Écoute le décompte… et joue !');
    const loop = () => {
      if (!this.running) return;
      const now = AC.currentTime, b = (now - t0) / spb;
      if (b < 0) { cd.textContent = Math.ceil(-b); } else if (cd.isConnected) cd.remove();
      this.setX(ST.LEFT + b*ST.BW + 22);
      this.clearTargets();
      this.steps.forEach((st, i) => {
        if (this.r.res[i] === null && b > st.beat + 0.5) { this.r.res[i] = 'miss'; this.noteG(i)?.classList.add('miss'); this.fb('Raté', 'var(--bad)'); }
        if (this.r.res[i] === null && Math.abs(b - st.beat) < 0.6) st.notes.forEach(m => keyEl(m)?.classList.add('target'));
      });
      this.progress(Math.max(0, Math.min(1, b / this.total)));
      if (b > this.total + 0.6) { this.running = false; this.clearTargets(); return this.finish(); }
      this.raf = requestAnimationFrame(loop);
    };
    loop();
  }
  inputRhythm(m, src) {
    if (!this.running || !this.r) return;
    const b = (AC.currentTime - this.r.t0) / this.r.spb - (src === 'mic' ? 0.08/this.r.spb : 0);
    const match = src === 'mic' ? (a, n) => a % 12 === n % 12 : (a, n) => a === n;
    const i = this.steps.findIndex((st, i) => this.r.res[i] === null && Math.abs(b - st.beat) <= 0.5 && st.notes.some(n => match(m, n)));
    if (i < 0) { if (src !== 'mic' || b >= -0.5) { this.flashKey(m, 'bad'); this.mistakes++; } return; }
    const st = this.steps[i];
    if (st.notes.length > 1) {
      if (src === 'mic') return;
      const set = this.r.partial[i]; set.add(m); if (!this.r.first) this.r.first = {};
      this.r.first[i] ??= b;
      if (!st.notes.every(n => set.has(n))) return;
      return this.rhythmHit(i, this.r.first[i]);
    }
    this.rhythmHit(i, b);
  }
  rhythmChroma(ch) {
    const b = (AC.currentTime - this.r.t0) / this.r.spb;
    const i = this.steps.findIndex((st, i) => this.r.res[i] === null && st.notes.length > 1 && Math.abs(b - st.beat) <= 0.5);
    if (i >= 0 && this.steps[i].notes.every(n => ch[n % 12] > 0.3)) this.rhythmHit(i, b - 0.1);
  }
  rhythmHit(i, b) {
    const dt = Math.abs(b - this.steps[i].beat); const perfect = dt < 0.22;
    this.r.res[i] = perfect ? 'perfect' : 'good';
    this.steps[i].notes.forEach(n => this.flashKey(n, 'good'));
    this.noteG(i)?.classList.add('ok');
    this.fb(perfect ? 'Parfait !' : 'Bien !', perfect ? 'var(--good)' : 'var(--accent)');
  }
  /* ---- end ---- */
  finish() {
    if (this.done) return; this.done = true;
    const n = this.steps.length; let acc, stats;
    if (this.mode === 'learn') {
      acc = n / (n + this.mistakes);
      stats = [[`${Math.round(acc*100)}%`, 'précision'], [n, 'notes'], [this.mistakes, 'erreur' + (this.mistakes > 1 ? 's' : '')]];
    } else {
      const res = this.r.res; const p = res.filter(x => x === 'perfect').length, g = res.filter(x => x === 'good').length;
      acc = Math.max(0, (p + g*0.75) / n - this.mistakes*0.02);
      stats = [[p, 'parfait' + (p > 1 ? 's' : '')], [g, 'bien'], [n - p - g, 'raté' + (n-p-g > 1 ? 's' : '')]];
    }
    const stars = acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : acc >= 0.4 ? 1 : 0;
    const rec = S.lessons[this.l.id] || (S.lessons[this.l.id] = { stars:0 });
    const wasDone = rec.stars > 0; let xp = 0; const newBadges = [];
    const award = id => { if (!S.badges.includes(id)) { S.badges.push(id); newBadges.push(BADGES.find(b => b.id === id)); } };
    if (this.mode === 'learn') {
      if (stars > rec.stars) { xp += (stars - rec.stars) * 20; rec.stars = stars; }
      xp += this.correct;
      if (!wasDone && stars > 0) xp += 20;
    } else if (stars >= 2 && !rec.crown) { rec.crown = true; xp += 40; award('rhythm'); }
    else xp += Math.round(acc * 10);
    if (stars > 0) {
      const t = today();
      if (S.streak.last !== t) { S.streak.count = (S.streak.last && dayDiff(S.streak.last, t) === 1) ? S.streak.count + 1 : 1; S.streak.last = t; }
      if (S.daily.date !== t) S.daily = { date:t, count:0 };
      S.daily.count++; if (S.daily.count === DAILY_GOAL) xp += 30;
      award('first');
      if (this.l.type === 'song' || this.l.type === 'hit') award('song');
      if (this.mode === 'learn' && this.mistakes === 0) award('perfect');
      if (this.l.type === 'chord') award('chord');
      if (S.streak.count >= 3) award('streak3');
      if (S.streak.count >= 7) award('streak7');
      if (totalStars() >= 30) award('stars30');
      if (!this.l.custom && WORLDS[this.l.world].lessons.every(x => (S.lessons[x.id]?.stars || 0) > 0)) award('world');
      if (LESSONS.every(x => (S.lessons[x.id]?.stars || 0) > 0)) award('maestro');
    }
    const lvBefore = level(); S.xp += xp; const lvUp = level() > lvBefore; save();
    jingle(stars > 0); if (stars >= 2) confetti();
    const next = this.l.custom ? null : LESSONS[this.l.index + 1];
    const title = stars === 3 ? 'Magnifique !' : stars === 2 ? 'Très bien !' : stars === 1 ? 'Réussi !' : 'Encore un essai ?';
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="card" role="dialog" aria-label="Résultat">
      ${mascot()}
      <h2>${title}</h2>
      <div class="bigstars">${[1,2,3].map(i => ICON.star(stars >= i)).join('')}</div>
      ${this.mode === 'rhythm' && rec.crown && stars >= 2 ? `<div class="newbadge">${ICON.crown}<span>Couronne du défi rythme gagnée !</span></div>` : ''}
      <div class="res-grid">${stats.map(([v, k]) => `<div><b>${v}</b><small>${k}</small></div>`).join('')}</div>
      <div style="font-weight:800;color:var(--accent)">+${xp} XP${lvUp ? ` · Niveau ${level()} atteint !` : ''}</div>
      ${newBadges.map(b => `<div class="newbadge">${ICON.medal('var(--gold)')}<span>Nouveau trophée : <b>${b.t}</b></span></div>`).join('')}
      <div class="row">
        <button class="btn" id="rAgain">${ICON.replay} Rejouer</button>
        ${this.mode === 'learn' && stars > 0 ? `<button class="btn" id="rRhythm">${ICON.crown} Défi rythme</button>` : ''}
        ${stars > 0 && next ? `<button class="btn primary" id="rNext">Leçon suivante</button>` : `<button class="btn primary" id="rMap">Carte</button>`}
      </div>
      ${stars > 0 && next ? `<button class="btn" id="rMap" style="background:none;color:var(--ink-soft)">Retour à la carte</button>` : ''}
    </div>`;
    document.body.appendChild(ov);
    const go = fn => () => { ov.remove(); this.destroy(); fn(); };
    ov.querySelector('#rAgain').onclick = go(() => startLesson(this.l.id, this.mode));
    ov.querySelector('#rRhythm')?.addEventListener('click', go(() => startLesson(this.l.id, 'rhythm')));
    ov.querySelector('#rNext')?.addEventListener('click', go(() => startLesson(next.id, 'learn')));
    ov.querySelector('#rMap').onclick = go(renderHome);
  }
  destroy() {
    this.running = false; this.done = true; this.stopDemo(); cancelAnimationFrame(this.raf); this.backStop?.();
    clearInterval(this.meterTimer); this.ro.disconnect(); if (Game === this) Game = null;
  }
}

/* ================= Toast & confetti ================= */
let toastT;
function toast(msg) {
  document.querySelector('.toast')?.remove(); clearTimeout(toastT);
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t);
  toastT = setTimeout(() => t.remove(), 4500);
}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('confetti'); c.hidden = false; const dpr = devicePixelRatio || 1;
  c.width = innerWidth*dpr; c.height = innerHeight*dpr; const x = c.getContext('2d'); x.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement); const cols = CVAR.map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({ length:140 }, () => ({ x:innerWidth/2, y:innerHeight*0.35, vx:(Math.random()-0.5)*14, vy:-Math.random()*13-4, r:Math.random()*6+4, c:cols[Math.floor(Math.random()*12)], a:Math.random()*6, va:(Math.random()-0.5)*0.4 }));
  const t0 = performance.now();
  (function f(t) {
    x.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r/2, -p.r/4, p.r, p.r/2); x.restore(); });
    if (t - t0 < 2600) requestAnimationFrame(f); else { x.clearRect(0, 0, innerWidth, innerHeight); c.hidden = true; }
  })(t0);
}

renderHome();
})();
